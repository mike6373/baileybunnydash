<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#15133c" />
  <title>Bailey Bunny Dash!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game-shell" aria-label="Bunny Run endless runner">
    <canvas id="game" aria-label="Three lane endless runner game"></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-box"><span class="tiny-label">SCORE</span><strong id="score">000000</strong></div>
      <div class="carrot-box"><span class="carrot-icon">◆</span><strong id="carrots">00</strong></div>
    </div>
    <div class="overlay" id="overlay">
      <div class="panel" id="panel">
        <div class="eyebrow">★ PIXEL RUNNER ★</div>
        <h1>BAILEY<br><span>BUNNY DASH!</span></h1>
        <p class="prompt">DODGE • HOP • COLLECT</p>
        <button id="start">START RUN</button>
        <div class="controls">SWIPE TO MOVE <i>·</i> ↑ HOP <i>·</i> ↓ SLIDE</div>
      </div>
    </div>
    <div class="touch-hint" id="touchHint">SWIPE TO MOVE</div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
